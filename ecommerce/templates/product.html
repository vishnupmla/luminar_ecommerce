{% block content %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
		<div class="product-section mt-150 mb-150">
		<div class="container">
			<div class="row">
				<div class="col-lg-8 offset-lg-2 text-center">
					<div class="section-title">
						<h3><span class="orange-text">Popular</span> Products</h3>
<!--						<p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Aliquid, fuga quas itaque eveniet beatae optio.</p>-->

				</div>
			</div>

			<div class="row">
				{% for i in cat.product.all %}

				<div class="col-lg-4 col-md-6 offset-md-3 offset-lg-0 text-center">
					<div class="single-product-item">
						<div class="product-image">
							<a href="{% url 'shop:productdetails' i.id%}"><img src="{{i.image.url}}" height="250px"  alt=""></a>
						</div>
						<h3 class="p-3">{{i.name}}</h3>
						<p ><span><i class="fa-solid fa-indian-rupee-sign"></i></span> {{i.price}}</p>
						<a href="{% url 'shop:productdetails' i.id%}" class="cart-btn">view</a>
					</div>
				</div>
				{% endfor %}
			</div>
		</div>
	</div>
	<!-- end product section -->
